name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NbaHub.slnx

      # Fails when code doesn't match .editorconfig. Fix locally with: dotnet format NbaHub.slnx
      - name: Check formatting
        run: dotnet format NbaHub.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: dotnet build NbaHub.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test NbaHub.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  # Runs only for pushes to main, after the tests pass.
  publish-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: "latest" (what Railway runs) and the commit SHA (to see or roll back a specific build).
      - name: Build and push image
        run: >
          dotnet publish src/NbaHub.Web/NbaHub.Web.csproj
          --configuration Release
          --os linux --arch x64
          -t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=${{ github.repository }}
          -p:ContainerImageTags='"latest;${{ github.sha }}"'

  deploy:
    needs: publish-image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: nba-player-hub

    steps:
      # Railway pulls the new "latest" image and runs the pre-deploy command
      # (--migrate --seed) before switching traffic over.
      - name: Redeploy on Railway
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret is not set, so nothing was deployed."
            exit 0
          fi
          npm install --global @railway/cli
          railway redeploy --service "$RAILWAY_SERVICE" --yes
